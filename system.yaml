# core_system —— 根 ServiceDesc（SystemDesc）

spec:
  goalRef: goal.md
  descRef: desc.md
  docs:
    - requirements/background.md     # R0 原始要求存档
    - requirements/runtime.md        # R1 运行时要求存档
    - principles.md
    - architecture.md
    - doctypes/README.md
  builtinServices:                   # 自举最小集（R1.3 + SelfRecursiveCore）
    - systems/builtin/self-recursive-core
    - systems/builtin/developer-system
    - systems/builtin/deploy-system
    - systems/builtin/storage-system
  workserviceRefs:                   # 按能力引用，不点名
    - {capabilities: scm, ci}        # 由 developer-system 落地（onedev）
    - {capabilities: object-storage, nfs}  # 由 storage-system 落地（nas+oss）
  instances:
    - name: default                  # 对应 core_system_instance 仓
      repoRef: ref/core-system-instance-repo
