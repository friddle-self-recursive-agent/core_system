# core/scheme.yaml —— 完整类型注册表（v0.13，R12 补全）
# 依据：concepts/ 全部概念文档 §3。标注：! = 必填；? = 可选；a|b = 枚举；已采纳的墓碑概念不注册。
# 机读语义（checker=scheme.ValidateDoc，R-TYPE 有规则即有 checker）：无标注=不强制必填但出现即校验形状
# （类型/枚举/嵌套）；子字段必填=decl 后缀 !（先例 ref!）；未知字段放行（只增不破坏）；散文声明透明放行。
# 层级判例：System=deploy_system → 实例=sybran 开发实例 → WorkService=jenkins/onedev/bug-management
apiVersion: core/v1
kind: Scheme
metadata:
  name: default
  scope: builtin
spec:
  version: core/v1

  # ============================================================
  # 一、对象类型（kinds，19 项；已采纳的墓碑概念不注册，见文末不注册清单）
  # storage=纯路径模板：占位符 <name>=对象名、<s>=系统段、<i>=实例段；
  # 交替分支以 | 分隔；分支须含 <name> 或为固定单例路径，否则机器不可寻址。
  # ============================================================
  kinds:

    - kind: Scheme                    # 自注册（支持按 aspect 细粒度拆分；单文件单 Scheme，R-DOC-8）
      builtin: true
      storage: "core/scheme.yaml | core/schemes/<name>.yaml"
      spec: {version: "!string", aspect: "?string", imports: "?[]ref", kinds: "[]KindReg", docTypes: "[]DocTypeReg",
             eventTypes: "[]EventTypeReg", dispatch: "[]DispatchRule", runtime: "?RuntimeReg",
             conventions: "?{status, cascade}"}
      rules: [禁止多Scheme在一个文件(导入除外,落库必拆单文件,R-DOC-8), 改已支持Scheme值免改代码/值不支持或改Scheme契约必触发代码改动(R-ENG-4)]

    - kind: DocType                   # 文档类型注册（本系统的 CRD 机制）
      builtin: true
      storage: doctypes/<name>.yaml
      spec:
        appliesTo: "{kinds: []string, scopes: []string}!"
        requiredSections: "[]string"          # ≤3（doctype.md 规则 2）
        writers: "[]string"                   # 默认最窄
        admission: "normal|strict"
        mandatory: "required|default|optional"  # 注册级；Service 可加严

    - kind: ServiceDesc
      builtin: true
      storage: systems/<name>/system.yaml
      spec:
        goalRef: "!ref"
        descRef: "!ref"
        docs: "?[]ref"
        provides: "?[]{interface: !ref, version: ?string, impl: ?builtin|ops}"   # 实现标注（2026-11-27 裁决，interface.md：本系统实现哪个 Interface 哪个版本；impl=builtin 进程内直调 | ops 外部接入用 ops 实现同一契约）
        requires: "?[]{interface: !ref, version: ?string}"   # 依赖标注（缺失时 resolver 逐层询问：默认/安装/导入，workflow.md §9b 同款）
        externalRefs: "?[]{capabilities: []string}"     # 按能力引用 WorkService
        instances: "[]{name: string, agentRefs: []ref}"
        builtinServices: "?[]ref"                        # 仅根 core_system
      status: {}                                          # Desc 无 Status（P2）
      relations: {owns: ServiceInstance, workflows: Workflow}

    - kind: ServiceInstance
      builtin: true
      storage: systems/<s>/instances/<name>/instance.yaml
      spec: {}                                            # v1 跟随 owner Desc
      fields:
        agentRefs: "[]ref"
        docs: "{impl: ref, verify: ref}"
        metricsInfo: "{store: ref, queries: map}"
      status:
        observedGeneration: "int"
        phase: "InSync|Drifting|Remediating|Failed|Escalated"
        conditions: "[]{type, status, reason, message, lastTransitionTime}"
        drift: "{summary, reportRef}"
      cascade: 删 systems/<s>/ 目录即级联（目录即对象，A51）

    - kind: Agent
      builtin: true
      storage: global/agents/<name>/agent.yaml
      spec:
        runtime: "?string (=dsh 外部运行时)"
        autoLevel: "?ask|auto|all"                
        defaultProvider: "?ref (=openai-default)" # Session Agent 默认大模型 Provider（点击 Provider 可配置 OpenAIProvider 账号/baseUrl/模型映射）
        globalRuleRefs: "?[]ref"                  # Session Agent 引用的全局规则（如 [rule/rule_eng, rule/rule_doc, rule/rule_ux, rule/rule_ctx, rule/rule_pub]）
        connectorOps: "[]{ops: ref, as: string}"  
        providers: "?[]ref"                       
        refs: "?[]ref"
        roles: "?[]ref"                           
        docsPolicy: "{read: []scopePattern, onDemand: bool}"
        eventScopes: "[]scopePattern"             # 明确该 Agent 可消费/处理的 Event scope 范围（event.md 规则 19）
        subAgents: "[]{name, spawn: machine-instance}"   
        retry: "{maxAttempts, backoff, escalateTo: root}" 
      status:
        phase: "Idle|Analyzing|Planning|AwaitingApproval|Executing|Verifying|Reporting|Failed"
        workflow: "?string"
        currentSession: "{id, startedAt, docsLoaded}"
        conditions: "[]Condition"

    - kind: WorkService              # 六面体
      builtin: true
      storage: global/workservices/<name>/workservice.yaml   # 作用域=Global（workservice.md §头表）——物化落 global/ 桶（layout.md §2 路径=scope 准绳；无 scope 段根级模板不可寻址=v0.44 收口前缺口）
      spec:
        category: "developer|storage|tool|business|…"   # tool 型=本机工具（dsh/http）
        connector:                                  # 连接面（原 ConnectorProvider 并入）
          types: "[]string"
          mode: "?cli|http|both (=both)"            # 调用通道（2026-11-27 用户裁决：Ops 双通道——cli=本机命令行 gh/dsh/kubectl；http=web http_ai/REST。core_agent 默认 cli，sybran/k8s 默认 http；同一 op 语义两通道）
          impl: "{kind: tool|image|source, ref: ref}"
          download: "!string"                       # image:// git:// pkg://
          scheme: "{ops: []string, params: map}"
          usage: "?string"
          llmPrompt: "!string"
          nameResolution: "无前缀=默认org | 带前缀=github.com/<org>/<name>"   
        observation:                                # 观测面（意图；数据在 MetricsInfo）
          metrics: "[]{name, query, thresholds: ?[]{op: gt|gte|lt|lte, limit: number}}"   # thresholds=告警面声明（v0.33 数据面首段：装配层阈值桥绑定锚——声明面外谓词不绑定不即兴语义）
          logs: "?{ref: ref}"
        data:                                       # 数据面（Ref 解析权威之一）
          entities: "[]{name, store: ref, access}"
        flows:                                      # 流程面
          "[]{name, stages: []string}"
        runtime:                                    # 运行状态观测面
          probes: "[]{httpGet|tcp|version, period}"
        tools:                                      # 工具与调用描述面（Ops 的描述来源）
          "[]{op, params, idempotent, undo: full|partial|none, rollback: {policy: never|auto|ask|optional, type: irreversible|code|agent|human, description: string, docRef?: ref, inverseOp?: op}, cleanup: ?op}"  # rollback 区分要不要回滚+四类回滚方式+回滚文档描述；cleanup 成对
      status: {conditions: "[]Condition"}           # runtime 面探针回写

    - kind: Interface                # 能力契约面（2026-11-27 用户裁决：builtin-system 内容——builtin 系统创建契约，接入 ldap/其他只需用 ops 实现；concepts/interface.md）
      builtin: true
      storage: "systems/builtin/<s>/interfaces/<name>.yaml"   # 契约归所属 builtin 系统所有（非全局独立注册面）
      spec:
        version: "string"                          # scheme 版本化：name 不变 version 递增（同 major 兼容演进，破坏性变更升 major）
        semantics: "?string"
        ops: "[]{op, params: map, idempotent: bool}"   # 契约 op 集（外部接入=用 ops 实现同一 op 集，可多不可少，Lint 对账）
      status: {}                                   # 无 Status（P2）；消费对账走 Lint

    - kind: ConnectorOps             # 工具调用面（v0.13 收窄：描述全在 WorkService）
      builtin: true
      storage: "global/connector-ops/<name>.yaml | systems/<s>/connector-ops/<name>.yaml | systems/<s>/instances/<i>/connector-ops/<name>.yaml"
      spec:
        workservice: "!ref"                          
        workflow: "?string (=core-system-developer-loop)"
        mode: "?cli|http|both (=both)"               # 调用通道（2026-11-27 用户裁决：Ops 双通道 cli|http——core_agent 默认 cli，sybran/k8s 默认 http；同一 op 语义两通道同实现，配置切换零耦合）
        trustLevel: "?trusted|external (=trusted)"   # 默认内部系统均为 trusted；外部系统显式设 external（或继承 auth.provider.trustLevel）
        provider: "?ref (=openai-default)"           # 默认关联的 Provider（点击 Provider 可直接配置 OpenAIProvider 账号/base地址与模型映射）
        llm: "?{provider: ?ref (=openai-default), model: ?string, tier: ?low|standard|high}"   # 算子级模型配置（重复性/日志清洗算子用 low 低智商轻量模型，设计/复杂诊断算子用 high 高智商推理模型）
        config: "?map"                               # 逻辑声明（endpointRef 等，A46）
        auth: "?{provider: ref}"
        ops: "[]string"                              # ⊆ WorkService.tools（Lint）
        flow: "?{nodes: []{name: !string, phase: ?string, title: ?string, unit: session|agent|connectops|gate, op: ?string, connector: ?string, provider: ?string, model: ?string, modelTier: ?low|standard|high, globalRuleRefs: ?[]string, service: ?string, entryEvents: ?[]string}}"   # 节点流转骨架（workflow.md §1.3 执行模型）：节点执行单元=session|agent|connectops|gate，含默认 provider、按任务/算子分级模型 model/modelTier（low|standard|high）、Session Agent 引用的 globalRuleRefs、多入口 entryEvents。缺失/骨架态的 ConnectorOps 可直接拉出代码开发任务由 developer-system 实现

    - kind: Workflow                 # v0.8 吸收 Workflow；2026-11-27 裁决：内置为 core-system-developer-loop（研发迭代主干，出厂默认不启动）+ default-task（通用任务相位机，Session Agent 可 ref globalRule），配置下沉至 Scheme Adapter 层
      builtin: true
      storage: "global/workflows/<name>.yaml | systems/<s>/workflows/<name>.yaml"
      spec:
        enabled: "?bool (=false)"                      # 规则开关：内置 core-system-developer-loop 出厂默认 false（不自动启动；core-system 实例自我迭代显式设 true，sybran 等对外项目默认关闭、按需绑定 developer-system/deploy-system 后启用）
        immutableNodes: "?bool (=false)"               # 节点拓扑锁定（core-system-developer-loop 恒 true：不可删除、不可增删/重排主干节点，节点内部参数与环境绑定全可配置）
        undeletable: "?bool (=false)"                  # 禁止删除保护（core-system-developer-loop 与 default-task 恒 true）
        services: "{involved: []ref, mode: observe|act}"   # 涉及哪些 service、怎么涉及
        llm: "?{provider: ref (=openai-default), model: string, tier: ?low|standard|high, nodeMapping: ?map}"   # 默认 Provider（openai-default）与按节点/任务类型的模型分级映射（low 重复性任务 / standard 常规任务 / high 设计与根因评审任务）
        globalRuleRefs: "?[]ref"                       # Session / Agent 节点默认引用的全局规则集（如 [rule/rule_eng, rule/rule_doc, rule/rule_ux, rule/rule_ctx, rule/rule_pub]）
        triggers: "{events: {types: []string, minLevel: ?debug|info|warn|error|fatal, services: ?[]string, keywordMatch: ?string}, timer: {resync: ?string, enabled: ?bool, interval: ?string, cron: ?string}}"
        logSource: "?{events: ?[]string, minLevel: ?debug|info|warn|error|fatal, services: ?[]string, keywordMatch: ?string, timer: ?{enabled: ?bool, interval: ?string, cron: ?string}, collector: ?{connector: ?string, op: ?string, query: ?string, autoDevelopOnMissing: ?bool}}"   # 节点 1（监听日志与 Event 过滤+ConnectorOps 收集指定日志；缺失时可拉出代码开发任务）
        entryPoints: "?[]{node: ?string, phase: ?string, enabled: ?bool, events: ?[]string, docTypes: ?[]string, description: ?string}"   # 多节点触发入口（如节点 1 监听日志/Event 从头走；节点 4 doc-apply 监听用户对话修改文档或发现 Bug 产出临时 BugDoc 触发 DocApplied 直接切入走 developer-system->验收->deploy-system->最后一步删 BugDoc 回写 InSync）
        systemBindings: "?{developerSystem: ?{service: ?string, resolution: ?default|install|import, templateRef: ?string, connector: ?string, op: ?string, conventions: ?map}, deploySystem: ?{service: ?string, resolution: ?default|install|import, templateRef: ?string, connector: ?string, op: ?string, envs: ?[]string, requireProdApproval: ?bool}}"   # 绑定 developer-system 与 deploy-system（逐层询问：默认开源习惯 default / 模板安装 install / 导入外部系统 import）
        verification: "?{mode: both|code|agent|human, connector: ?string, op: ?string, onFail: ?retry-develop|block|ask, conditions: ?[]{id: ?string, kind: ?code|test|agent|probe|custom, title: ?string, command: ?string, required: ?bool}}"   # 节点 6 验收配置（怎么验收+可自定义验收条件清单）
        ingest: "{dedup: {window}, group: {by, max}, filterLevels}"
        connector: "?ref (=<同名 ConnectorOps>)"        # 默认绑定的 ConnectorOps（缺省同名；apply 时开始实现节点流转）
        phases: "[]Phase"                              # 声明正向主线步序（支持字符串或富节点声明：{name, phase, title, unit, entryEvents, connector, op, provider, model, modelTier, globalRuleRefs, config}）；异常终态 Failed 与挂起态 Paused 属侧轨态，禁止放在线性 phases 末尾
        transitions: "?[]{from: Phase, on: string, to: Phase}"   # 显式迁移表（静态 FSM 规则表——严禁与运行期实际轨迹 run.history 混用）；支持条件分支（worth_fixing/ignore/retry-develop）与多入口切入
        onEscalate: "{action: pause|finish-tick|continue(默认 pause), notify: bind-role}"   # AUTO 处理不了的事件到达时的暂停策略（可配置）
        onFailed: "{backoff, maxAttempts, rollbackPolicy: ?never|auto|ask|by-step, escalate: {to: root, notify: role-holders}}"
        trustGate: "?{enabled: bool, mode: code|agent|both, verifierRef?: string, onReject: block|ask|sanitize}"   # 针对 trustLevel=external 的 ConnectorOps/Provider 外部返回内容，Workflow 级可配由代码或 Agent 先判断一遍内容是否 OK
        brakes: "{cooldown, maxMutationsPerTick, avoidRepeatFix}"    # 强制默认（可收紧不可关闭；cooldown 强制默认 2m ∧ 变更上限强制默认 10）
        approval: "{mode: human|auto|agent, autoCriteria: ?string, maxRiskLevel: ?low|medium|high}"   # 节点 3 审批策略（2026-11-27 扩展：human=人工审批挂起；auto=全自动放行；agent=Agent 按 autoCriteria/maxRiskLevel 自动判断审批，不满足转人工；前端可直接编辑）
        regression: "{statusWriteback: bool, bugDocPolicy: ?invalidate|delete|keep, cleanTempBugDoc: ?bool, targetPhaseOnConverge: ?string (=InSync), postActions: ?[]{id: ?string, kind: ?string, targetDocType: ?string, action: ?string, enabled: ?bool, title: ?string}, reports: [DriftReport, SessionLog]}"   # 总结最后一步（Reporting）：通用解释器按 postActions/bugDocPolicy 声明对临时 BugDoc 执行标记失效(invalidate)/删除(delete)/保留不删(keep)（可自由添加/删除该动作项）并将 ServiceInstance 状态回写为 InSync
      builtinSet: [core-system-developer-loop, default-task]   # 2026-11-27 用户裁决：内置 workflow 为 core-system-developer-loop（研发迭代主干，出厂默认不启动）+ default-task（内置任务相位机，Session Agent 可 ref globalRule）；其余旧名由 runtime.workflows.aliases 在 Scheme Adapter 层兼容映射

    - kind: Task                     # 多任务并发调度单位（concepts/task-scheduler.md；2026-11-26 用户裁决：无关任务并发 agent，可调）
      builtin: true
      storage: "global/tasks/<name>.yaml | systems/<s>/tasks/<name>.yaml | global/tasks/<name>.md | systems/<s>/tasks/<name>.md"
      format: "yaml|markdown-frontmatter"            # 支持纯 YAML 或 YAML frontmatter + Markdown 正文（解析器与 UI 必须双形态识别，禁按纯 YAML 失败而判空）
      spec:
        title: "!string"                                  # 人话标题（任务中心展示）
        summary: "?string"                                # 目标/验收摘要
        source: "proposal|event|drift|manual|loop"        # 来源（审计/筛选）
        sourceRef: "?ref"                                 # 来源对象/事件
        scopeRef: "?ref"                                  # 影响域（ServiceDesc/ServiceInstance）
        dependsOn: "?[]ref"                               # 依赖 DAG（未完成=blocked）
        touches: "?{repos: []string, paths: []string, objects: []ref, exclusive: []string}"  # 写集/独占资源（并发冲突判定）
        priority: "low|normal|high|critical"
        agent: "?ref"                                     # 可选：指定执行 agent
        workspace: "?{mode: worktree|inplace, base: ?string, branch: ?string}"  # 代码任务隔离
        limits: "?{maxConcurrent: ?int, timeout: ?duration}"  # 单任务覆写（只收紧）
      status:
        phase: "queued|ready|blocked|running|verifying|done|failed|canceled"
        attempts: int
        agentSession: "?string"                           # 宿主会话 ID（深链）
        dependsOn: "?[]ref"
        lastAction: "?string"                             # 一句话（人看）
        lastError: "?string"

    - kind: Proposal                 # 内部变更提案对象（concepts/proposal.md——系统/Agent 跨系统提案与审计归档载体；人类日常入口统一为 rootAgent 对话，不在控制台前置独立「需求提案」一级菜单）
      builtin: true
      storage: "global/proposals/<name>.yaml | systems/<s>/proposals/<name>.yaml | global/proposals/<name>.md | systems/<s>/proposals/<name>.md"
      format: "yaml|markdown-frontmatter"            # 支持 YAML frontmatter + Markdown 需求正文（避免按纯 YAML 解析失败渲染空正文）
      spec:
        title: "!string"                     # 标题
        summary: "!string"                   # 目标（做什么/为什么——批准后随派单载荷交给执行体）
        acceptance: "[]string"               # 验收标准（可验证条目——Goal.acceptance 同词汇）
        impact: "?string"                    # 影响面（涉及系统/对象/风险说明）
        priority: "low|normal|high|critical" # 优先级（低危/高危审批分流判定输入——分流配置=部署侧 --proposal-auto-approve）
        proposer: "!string"                  # 提出人（主体标识：人/agent/自动化节点——审计回链 apply_log.subject）
        origin: "?console|agent|api|cli"     # 提交入口（console 只是入口之一；缺省由提交面回填，纯审计不参与判定）
        status: "!draft|submitted|approved|rejected|landed"  # 状态闭合集（迁移纪律=写面主体：draft=本地草稿未入册→submitted=提交待审→approved|rejected=判定→landed=产物落盘回写；checker=枚举闭合集，迁移序=主体纪律）
        landing: "?{target: doc|task, ref: ?string, docsUpdate: ?bool}"  # 产物指针（批准后执行体落点声明：doc=docsRoot 对象草稿 / task=部署侧任务文件；产物真实落盘=apply-workflow agent 真实拉起段，declared-deferred；docsUpdate=派工须随行更新受影响现有文档，缺省 true——不回写文档不得 landed）

    - kind: Provider                 # 账号包（含 OpenAIProvider：账号/base地址/模型分级映射）
      builtin: true
      storage: global/providers/<name>.yaml
      spec:
        kind: "llm|openai|im|email|cloud|network|generic"   # openai/llm=OpenAI 兼容大模型账号包（账号/secret + baseUrl + models + modelTiers/taskModelMapping）；network=网络出口（代理/DNS/域名转发，声明/运行时分离见 concepts/provider.md 规则 6）
        trustLevel: "?trusted|external (=trusted)"   # 默认内部系统均为 trusted；外部系统显式设 external（Workflow 级可配 code/agent 检验内容是否 OK）
        auth: "{scheme, account: ?string, secret: {source: 'secret:|vault:|env:|keychain:', rotation}}"   # 明文禁（引用式取值四前缀——provider.md 规则 2；secret:=部署侧秘密库 runtime.storage.secrets，v0.34 起与 vault:/env:/keychain: 并列）
        config: "?map"                               # OpenAIProvider 含 {baseUrl, defaultModel, models: []string, modelTiers: {low, standard, high}, taskModelMapping: map}
        connector: "?ref"                            # 可为空
      builtinSet: [openai-default]                   # Session / ConnectorOps / Workflow 的默认 OpenAIProvider（点击 Provider 即可配置账号、baseUrl 与模型映射）

    - kind: Notification             # 一 Scheme 一 Instance
      builtin: true
      storage: global/notifications/<name>.yaml
      spec:
        channel: "{kind: im|email|webhook, provider: ref}"
        on: "{events: []string, levels: []string}"
        route: "{to: role-holders, dedup: {window}, minLevel}"   # v0.35 阶段门段：minLevel=等级下限（低于下限零受理 filtered 计数可见）；窗口内同 dedupKey 至多一封（deduped 计数可见）——通知只由相位终态事实触发（notification.md 规则 5，apply 写入不触发用户通知）
        template: "?{ref}"                       # 文案模板=引用包装对象（{ref: <ref>}——notification.md §3 例与存量对象同形态；v0.48 净入 lint 对账修正：?ref 标量声明与概念例/存量对象劈叉，声明面单点修正收口)
      status: {delivered: "{last24h, failed}"}

    - kind: User                     # 用户系统 builtin（2026-11-27 用户裁决：builtin=单用户+token 授权，concepts/user-system.md）
      builtin: true
      storage: global/users/<name>.yaml
      spec:
        display: "!string"
        auth: "{mode: token|idp (=token)}"               # v0 唯一授权方式=现有 token 授权（gate/dsh token 机制声明引用现状）；idp 取值=ldap/sso 落地轮启用
        contact: "{im: {provider, userId}, email}"       # 完整用户结构=ldap/sso 阶段才有（builtin 阶段休眠不预埋）
        roles: "[]ref"
        groups: "[]ref"                                  # builtin 阶段恒空
      status: {lastSeen: timestamp}
      builtinSet: [builtin-user]     # 内置单用户不可删（role/global/admin 同款防锁死）

    - kind: Group                    # 组只绑 role
      builtin: true
      storage: global/groups/<name>.yaml
      spec: {roles: "[]ref"}                         # 禁权限字段

    - kind: Role                     # 权限 + 对象挂载
      builtin: true
      storage: global/roles/<name>.yaml
      spec:
        on: "?[]ref"                                 
        permissions: "[]{scope: 'global|systems/<n>/*|core/*'!, actions: [read|write|approve|call|publish|*]!}"   # 条目子字段必填=decl 后缀 !（先例 ref!）；条目结构完整=授权面与写面闸门共同语义（permission.LoadObjects 同判）；publish=事件发布域动作（event.md 规则 8 v0.20——发布权限域与 apply 写权限域分立）；core/*=cored 资源域家族（v0.52 能力 A 随行——core/design-docs 写设计文档域，permission.domainPath core/ 前缀原样透传既有语义）
      status: {holders: "[]User"}                    # user-system 投影
      builtinSet: [global/admin]                     # 全权限不可删

    - kind: Ref                      # 声明式逻辑引用
      builtin: true
      storage: "global/refs/<name>.yaml | systems/<s>/refs/<name>.yaml"
      spec:
        resolve: "{system: ref!, type: code|doc|url|resource|service, params: map}"
        purpose: "?string"
        ttl: "?duration"
      status: {lastResolution: "{at, by, value, cacheTtl}"}
      rules: [spec 禁物理地址, 解析链 ≤2, owner 必挂]

    - kind: TaskScheme               # 四层执行第三层（按 aspect 细粒度拆分；单文件单 TaskScheme，R-DOC-8）
      builtin: true
      storage: systems/<s>/schemes/<name>.yaml
      spec:
        aspect: "?string"            # 细粒度方面（build|verify|reconcile|notify|deploy|...）
        trigger: "{events: []string, match: map}"
        steps: "[]{id, connector: opsRef, op, args, rollback?: {policy: never|auto|ask|optional, type: irreversible|code|agent|human, description: string, docRef?: ref, inverseOp?: op}}"
        params: "[]string"
        onFailure: "{retry, backoff, rollbackPolicy?: never|auto|ask|by-step, then: escalate}"
      rules: [禁止多Scheme在一个文件(导入除外,落库必拆单文件,R-DOC-8), 改值与行为描述免改代码/值不支持或契约改动必触发代码改动(R-ENG-4), 回滚区分要不要回滚与四类回滚方式(irreversible|code|agent|human)并强制回滚文档描述]

    - kind: Template                  # 统一模具×五层 appliesTo（2026-11-26 裁决：模板=要求集，Ref 语义非实际系统；resolver 自动选型，解析不了逐层询问；含 workflow 层模板 workflow.md §9b）
      builtin: true
      storage: global/templates/<name>.yaml
      spec:
        appliesTo: "!workservice|servicedesc|serviceinstance|workspace|workflow"   # 五层模具（含 workflow 层——支撑真实 Workflow 模板入库，取代界面硬编码静态卡）
        provides: "?{capabilities: []string, category}"
        requires: "?{images: [{name, source, digest!}], storage: {kind: oss|nas|system|any, size: ?string, speed: ?hot|warm|cold}, ports: []int, compute: ?map, endpoints: ?map, systems: ?[]ref}"   # 要求集（类型偏好+大概空间+速度要求——禁止实际地址；镜像 source=取货地址要求可换源，digest 不变）
        goals: "?[]string"                          # servicedesc 层：哪些 goal
        mold: "?map"                                # 层特有骨架（workservice=六面体 / servicedesc=goalRef+docs / instance=agentRefs+docs / workspace=project 组织 / workflow=phases+transitions+gates+rollback）
        install: "?[]{action}"                      # workservice 层：digest 必填；幂等；三段 undo
        postInstall: "?[]{action: register-workservice}"   # 产出六面体骨架
        asks: "[]{field, question, kind: ?provider-ref|resource-ref|enum|string, options: ?[]string, default: ?}"   # resolver 解析不了的才问（必带缺省/示例；R-UX-1）
        chain: "?[]workservice|servicedesc|serviceinstance|workspace|workflow"   # 实例化下探层序（一层层问下去；每层 resolver→asks→确认卡）

    - kind: Skill                    # 工具使用缓存
      builtin: true
      storage: systems/<s>/instances/<i>/skills/<name>.yaml
      spec:
        sourceOps: "!ref"
        when: "?{task}"
        prompt: "!string"
        examples: "[]{op, args, outcome}"           # 脱敏
        origin: "{sessionRef, cachedAt}"
        cachePolicy: "{ttl: 30d, invalidateOn: {providerVersionChange: true}}"

    # 不注册（按裁决）：
    #   Event —— 短生命周期数据非文档对象，队列由 dsh core plugin 实现
    #   ConnectorProvider —— 并入 WorkService.connector
    #   Bind —— 并入 Role.on；Owner/Finalizer —— 删除
    #   Status —— 降级为字段约定

  # ============================================================
  # 二、文档类型（docTypes 完整注册）
  # category: design（设计/知识文档，默认导出）| runtime（运行期文档，如 BugDoc/DriftReport/PlanDoc/SessionLog，默认不导出）
  # exportDefault: 默认是否纳入文档导出（作为数据库导出配置 docs_export_config 的种子初值，独立配置项，绝不在导出器代码中硬编码）
  # ============================================================
  docTypes:
    - {name: Goal,           mandatory: required, category: design,  exportDefault: true,  sections: [intent, acceptance],          writers: [human, "role:owner"], appliesTo: ServiceDesc, admission: normal}
    - {name: Desc,           mandatory: required, category: design,  exportDefault: true,  sections: [overview, boundaries],        writers: [human, "role:owner"], appliesTo: ServiceDesc, admission: normal}
    - {name: Rule,           mandatory: default,  category: design,  exportDefault: true,  sections: [rules],                       writers: [human, "role:owner"], appliesTo: ServiceDesc, admission: normal}   # 条目带 ruleId?/type: policy|lint；type=lint ⇒ 必挂 checker（rule.md R-TYPE）
    - {name: WorkflowDesign, mandatory: optional, category: design,  exportDefault: true,  sections: [flows],                       writers: [human],              appliesTo: ServiceDesc, admission: normal}
    - {name: Metrics,        mandatory: default,  category: design,  exportDefault: true,  sections: [indicators, thresholds],      writers: [human, "role:owner"], appliesTo: ServiceDesc, admission: normal}
    - {name: DataDesign,     mandatory: optional, category: design,  exportDefault: true,  sections: [entities, flows],             writers: [human],              appliesTo: ServiceDesc, admission: normal}
    - {name: DataMetrics,    mandatory: optional, category: design,  exportDefault: true,  sections: [flows, slo],                  writers: [human],              appliesTo: ServiceDesc, admission: normal}
    - {name: Auth,           mandatory: default,  category: design,  exportDefault: true,  sections: [subjects, grants],            writers: [human],              appliesTo: ServiceDesc, admission: strict}
    - {name: DeployDesign,   mandatory: optional, category: design,  exportDefault: true,  sections: [envs, rollout],               writers: [human],              appliesTo: ServiceDesc, admission: normal}
    - {name: CodeDesign,     mandatory: optional, category: design,  exportDefault: true,  sections: [modules],                     writers: [human],              appliesTo: ServiceDesc, admission: normal}
    - {name: ImplDoc,        mandatory: required, category: design,  exportDefault: true,  sections: [how, mapping],                writers: [agent],              appliesTo: ServiceInstance, admission: normal}
    - {name: VerifyDoc,      mandatory: required, category: design,  exportDefault: true,  sections: [guarantees, probes],          writers: [agent, "role:owner"], appliesTo: ServiceInstance, admission: normal}
    - {name: DriftReport,    mandatory: auto,     category: runtime, exportDefault: false, sections: [drifts, actions],             writers: [workflow-engine],    appliesTo: ServiceInstance, admission: normal}
    - {name: Runbook,        mandatory: optional, category: design,  exportDefault: true,  sections: [],                            writers: [human],              appliesTo: ServiceInstance, admission: normal}
    - {name: Requirements,   mandatory: required, category: design,  exportDefault: true,  sections: [archive],                     writers: [human],              appliesTo: core_system 存档, admission: strict}
    - {name: PlanDoc,        mandatory: required, category: runtime, exportDefault: false, sections: [intent, steps],               writers: [agent],              appliesTo: ServiceInstance, admission: normal}
    - {name: SessionLog,     mandatory: required, category: runtime, exportDefault: false, sections: [phases, docsLoaded, outcome], writers: [agent],              appliesTo: ServiceInstance, admission: normal}
    - {name: Memory,         mandatory: optional, category: design,  exportDefault: true,  sections: [content, refs],               writers: [agent],              appliesTo: ServiceInstance, admission: normal}   # Agent 记忆条目（默认记忆系统=Service 文档管理）
    - {name: StateModel,     mandatory: default,  category: design,  exportDefault: true,  sections: [objects, transitions],        writers: [human, "role:owner"], appliesTo: ServiceDesc, admission: normal}   # 业务对象状态词表+迁移表（闭合集+主体纪律；R-BIZ-1）——common-business-system 约束层（concepts/business-system.md §4.1）
    - {name: Finance,        mandatory: default,  category: design,  exportDefault: true,  sections: [budget, gates],               writers: [human, "role:owner"], appliesTo: ServiceDesc, admission: normal}   # 预算科目+闸门规则（现状数字禁手填，只许从流水推导——R-BIZ-2）——common-business-system 约束层
    - {name: BugDoc,         mandatory: optional, category: runtime, exportDefault: false, sections: [repro, impact, fix],          writers: [agent, human],         appliesTo: ServiceInstance, admission: normal}   # 运行期临时 bug 文档（发现 bug 不改设计时也可触发 BugDoc 走流程；总结最后一步 Reporting 删除 BugDoc 并回写 InSync；默认不导出，由数据库导出配置项控制）
    # mandatory=注册级；Service 可加严；Builtin 无特殊档

  # ============================================================
  # 三、事件类型
  # 发布面（v0.20，event.md 规则 8）：全部注册类型可经写面注入端点发布——类型注册校验
  # +level 缺省=defaultLevel 投影+同管线去重/派发/归档（零旁路）；发布动作=publish × events
  # 资源域，与 apply 写权限域分立；注入通道的 source 由服务侧判定恒 human（本表 source 列
  # 是引擎内部来源声明，不是注入载荷参数）。
  # 行可选字段（v0.5x 事件分诊 + 2026-11-26 分层/展示/scope 裁决，event.md 规则 16/18/19）：
  #   - tags: []string（type→标签，供检索/亲和）
  #   - importance: int(0-100)（统一 0-100 标度；缺省由 defaultLevel 投影：debug=20/info=40/warn=75/error=90/fatal=100）
  #   - tier: "infra|domain|attention"（缺省 domain；Heartbeat/ReconcileTick 等底层节拍恒 infra）
  #   - visibility: "default-visible|default-hidden"（tier=infra 缺省 default-hidden，默认在界面/报告/第一段侦察中隐藏）
  #   - 每条 Event 必带 metadata.scope（四层 Scope），且派发与消费强制校验 event.metadata.scope ∈ agent.spec.eventScopes。
  # ============================================================
  eventTypes:
    # ExternalChanged（event.md 规则 12 v0.30 watch 桥首段）：装配层驱动 connectors.Watch 契约通道自产——source 服务侧判定恒 connector，dedupKey=驱动侧因由声明（<obj>:<change>:hash 投影），detail 不进总线；落 run 同拍即拍（workflow.md 规则 15 v0.30 段）。
    - {type: ExternalChanged,  source: connector, defaultLevel: info,  tier: domain,    visibility: default-visible, dedup: "<obj>:<change>:hash", route: owner-workflow}
    # MetricThreshold（event.md 规则 13 v0.31 阈值桥首段）：装配层阈值桥数据面样本通道服务侧判定自产——source 服务侧判定恒 metrics，dedupKey=<metric>:<window>（同指标同窗口越限聚合防风暴）；阈值判定是服务侧动作（数据面只产样本不带判定）；落 run 同拍即拍（workflow.md 规则 15）。
    - {type: MetricThreshold,  source: metrics,   defaultLevel: warn,  tier: attention, visibility: default-visible, dedup: "<metric>:<window>",   route: owner-workflow}
    - {type: DocApplied,       source: core,      defaultLevel: info,  tier: domain,    visibility: default-visible, dedup: "apply 落库必发；engine 自写豁免",     route: owner-workflow}
    - {type: DocDeleted,       source: human,     defaultLevel: info,  tier: domain,    visibility: default-visible, dedup: "doc-deleted:<obj>",   route: dead-letter}   # 对象删除（DELETE /v1/objects 面——2026-11-26 假数据清理批；involved=被删对象锚；删除已成事实事件 best-effort，账面=doc_history 终态行+apply_log deleted）；bug 生命周期 §9a「修复后删临时 BugDoc」即走此词
    - {type: DriftFixed,       source: engine,    defaultLevel: info,  tier: domain,    visibility: default-visible, dedup: "<workflow>:<tick>",       route: observation-bus}
    - {type: ApprovalNeeded,   source: "permission|core",defaultLevel: warn, tier: attention, visibility: default-visible, dedup: "<rule>:<obj>",    route: notification/*}   # 双产源：permission=人审档拒绝路径（v0.21）；core=Proposal 提交高危分流自产（v0.51，dedup=proposal:<obj>——concepts/proposal.md 规则 5）
    - {type: ApprovalGranted,  source: human,     defaultLevel: info,  tier: domain,    visibility: default-visible, dedup: "approval:<obj>",      route: dead-letter}   # 审批通过信号（workflow.md 规则 13 / proposal.md）：involved 支持 Workflow/<scope>/<name>（run 闸锚续行）、Proposal/<scope>/<name>（提案批准落账与派单）及草稿审批锚；dispatch 派发面无目标
    - {type: ApprovalRejected, source: human,     defaultLevel: warn,  tier: attention, visibility: default-visible, dedup: "approval:<obj>",      route: dead-letter}   # 同上：驳回=Workflow run 侧轨终态 Failed 或 Proposal status=rejected 落账
    - {type: Escalate,         source: engine,    defaultLevel: error, tier: attention, visibility: default-visible, dedup: "<workflow>:<reason>",     route: owner-workflow+root+notification/*}   # owner-workflow 收到后按其 onEscalate 策略决定暂停
    - {type: Heartbeat,        source: "agent|core", defaultLevel: debug, tier: infra,  visibility: default-hidden,  dedup: "heartbeat:<subject>:<window>", route: dead-letter}   # 周期正常心跳底层事件（event.md 规则 18）：默认不展示（default-hidden），仅调试显式开启 showInfra 时可见
    - {type: HeartbeatLost,    source: core,      defaultLevel: error, tier: attention, visibility: default-visible, dedup: "<agent>",             route: parent-agent+notification/*}
    - {type: InstallRequested, source: human,     defaultLevel: info,  tier: domain,    visibility: default-visible, dedup: "<template>:<target>", route: workflows/deploy-system-workflow}
    - {type: TemplateFound,    source: connector, defaultLevel: info,  tier: domain,    visibility: default-visible, dedup: "<org>:<template>",    route: workflows/deploy-system-workflow}
    - {type: SessionClosed,    source: agent,     defaultLevel: info,  tier: domain,    visibility: default-visible, dedup: "<session>",           route: instance-docs}
    - {type: ReconcileTick,    source: core,      defaultLevel: info,  tier: infra,     visibility: default-hidden,  dedup: "reconcile:<at>",      route: workflows/core-system-developer-loop}   # 定时巡检到点（底层节拍 tier=infra，默认不展示 default-hidden；event.md 规则 18）
    - {type: LoopRequested,    source: human,     defaultLevel: info,  tier: domain,    visibility: default-visible, dedup: "<loop>:<round>",       route: root-agent}   # CLI/API 请求跑一轮自循环（corectl loop；R-UX-8）：事件→wake 桥→宿主拉起 core-headless 会话；source 服务侧恒 human
    - {type: TaskStateChanged, source: core,      defaultLevel: info,  tier: domain,    visibility: default-visible, dedup: "task:<id>:<phase>",   route: observation-bus}   # 多任务调度状态变迁（concepts/task-scheduler.md）：queued/ready/running/verifying/done/failed/blocked；任务中心实时刷新
    - {type: TaskCancelRequested, source: human,  defaultLevel: info,  tier: domain,    visibility: default-visible, dedup: "task-cancel:<id>", route: scheduler}   # 任务取消请求（concepts/task-scheduler.md；involved=Task/<scope>/<name>）：调度器每拍扫归档→非 running 直接 canceled；running 注记等自然结束
    - {type: TaskConflictResolved, source: human, defaultLevel: info,  tier: domain,    visibility: default-visible, dedup: "task-conflict:<id>:<choice>", route: scheduler}   # Apply 关口冲突裁决（BUG-013：detail=abort-current|pause-first）：调度器据裁决放弃当前任务或让位在先任务
    # 会话活性事件族（KI-003，event.md 规则 14/18；引擎内部源六段=装配层 watchdog 自产，source 恒 core）
    - {type: SessionStalled,   source: core,      defaultLevel: error, tier: attention, visibility: default-visible, dedup: "session:<id>",        route: root-agent+notification/*}   # 停滞判定态=SuspectedStall（判定词与事件词分立：事件名=SessionStalled 与 HeartbeatLost 同族）；自愈固定顺序第一步=注入「继续」
    - {type: SessionHealed,    source: core,      defaultLevel: info,  tier: infra,     visibility: default-hidden,  dedup: "session-heal:<id>",   route: dead-letter}   # 注入「继续」后心跳恢复——底层恢复事实默认不展示（tier=infra, default-hidden）
    - {type: LongTaskRunning,  source: core,      defaultLevel: info,  tier: infra,     visibility: default-hidden,  dedup: "longtask:<id>",       route: dead-letter}   # 长任务显式化（有进展心跳=不判停滞，tier=infra 默认折叠/不混入异常流）
    - {type: BugReport,        source: "core|agent", defaultLevel: error, tier: attention, visibility: default-visible, dedup: "bug:<sess>:<sig>", route: workflows/core-system-developer-loop}   # 运行期 bug 上报（workflow.md §1/§9a）：统一进 core-system-developer-loop 首节点（监听日志event→agent判断→审批→doc apply→developer-system→验收→deploy-system）
    - {type: GhIssueEvent,     source: connector, defaultLevel: info,  tier: domain,    visibility: default-visible, dedup: "gh-issue:<repo>:<num>", route: workflows/gh-issue-triage}   # GitHub Issue 事件（新开/重开/被标注，connectops-gh watch 桥自产，workflow.md §9c）：进 gh-issue-triage（agent 判断→文档更新→发版→github release）

  # ============================================================
  # 四、事件路由（穷举缺省 + 死信兜底）
  # ============================================================
  dispatch:
    - {on: ExternalChanged,  for: "owner:*",        dispatch: owner-workflow}
    - {on: MetricThreshold,  for: "owner:*",        dispatch: owner-workflow}
    - {on: DocApplied,       for: "owner:*",        dispatch: owner-workflow}   # 多节点第二入口：用户对话或手动修改文档触发 DocApplied 时，core-system-developer-loop 经 entryPoints 从节点 4 (doc-apply / Planning) 直接切入流向 developer-system→验收→deploy-system
    - {on: DocDeleted,       for: "any",            dispatch: dead-letter}   # 删除已落账（doc_history/apply_log）——事件仅可见性；dispatch 无目标 dead-letter 兜底
    - {on: DriftFixed,       for: "any",            dispatch: observation-bus}
    - {on: ApprovalNeeded,   for: "any",            dispatch: notification/*}
    - {on: ApprovalGranted,  for: "any",            dispatch: dead-letter}   # 审批信号族：run 域迁移事件（workflow.md 规则 13）——dispatch 派发面无目标，不另起新 run
    - {on: ApprovalRejected, for: "any",            dispatch: dead-letter}   # 同上
    - {on: Escalate,         for: "any",            dispatch: root-agent, cc: notification/*}
    - {on: Heartbeat,        for: "any",            dispatch: dead-letter}   # 底层正常心跳默认不展示（tier=infra, visibility=default-hidden），归档/活性账面备查
    - {on: HeartbeatLost,    for: "owner:agent",    dispatch: parent-agent, cc: notification/*}
    - {on: InstallRequested, for: "any",            dispatch: workflows/deploy-system-workflow}
    - {on: TemplateFound,    for: "any",            dispatch: workflows/deploy-system-workflow}
    - {on: SessionClosed,    for: "owner:instance", dispatch: instance-docs}
    - {on: ReconcileTick,    for: "any",            dispatch: workflows/core-system-developer-loop}   # 巡检到点→一次全量对账 run（对账锚=core-system-developer-loop）；v0.29 事件驱动推进源首段
    - {on: LoopRequested,    for: "any",            dispatch: root-agent}   # CLI 触发自循环（R-UX-8）：wake 桥按白名单转发宿主 /wake/spawn，由部署侧 loop 命令拉起 core-headless 会话
    - {on: TaskStateChanged, for: "any",            dispatch: observation-bus}   # 任务状态变迁=观测事实（任务中心/事件流消费）
    - {on: TaskCancelRequested, for: "any",         dispatch: dead-letter}   # 取消请求由调度器归档扫描消费（非派发面）——dead-letter 兜底可见
    - {on: TaskConflictResolved, for: "any",        dispatch: dead-letter}   # 冲突裁决同上（调度器扫描面）
    - {on: SessionStalled,   for: "any",            dispatch: root-agent, cc: notification/*}   # 会话停滞=人注意事实（KI-003，event.md 规则 14）：root-agent 主路=自愈链入口（第一动作=注入固定 prompt「继续」）；cc=bind 通知旁路
    - {on: SessionHealed,    for: "any",            dispatch: dead-letter}   # 恢复=活性事实非处置触发（自愈动作在 watchdog 侧已执行）——dead-letter 观测兜底可见
    - {on: LongTaskRunning,  for: "any",            dispatch: dead-letter}   # 长任务显式汇报=进展事实（有进展心跳=不判停滞）；dead-letter 观测兜底可见
    - {on: BugReport,        for: "any",            dispatch: workflows/core-system-developer-loop, cc: root-agent}   # 运行期异常统一进 core-system-developer-loop
    - {on: GhIssueEvent,     for: "any",            dispatch: workflows/gh-issue-triage, cc: root-agent}   # GitHub Issue 事件进 gh-issue-triage（workflow.md §9c——定时整理+事件即时双入口）
    - {on: "*",              for: "scope:builtin/*", dispatch: workflows/builtin-root}
    - {on: "*",              for: "any",            dispatch: dead-letter}   # 死信必须可见（词汇=hub 合成死信/eventbus routed_to 同一词）

  # ============================================================
  # 五、运行时
  # ============================================================
  runtime:
    baseAgent: dsh                  # 外部运行时（deepseek 插件机制）；core 即 dsh plugin
    executionLayers: [intent, agent, scheme, code]
    ruleVerification:               # R-TYPE-3：规则→验证模式的声明（Rule 条目 mode/checker/agent 与 ruleChecks 双向追溯）
      modes: [code, agent, human]
      code: {registry: ruleChecks, executor: "connectorOps/code-audit#check", unbound: error}   # code-audit=新 ConnectorOps 实现（deploy-system connectops-code-audit）
      agent: {handTo: service-agent, verdict: "pass|fail|unverified", record: VerifyDoc}          # 语义规则丢给 agent 验证；unverified 不算通过
    ruleChecks:                     # Rule→checker 机读注册表（ruleId 双向追溯；code 规则缺行=unbound error）
      - {ruleId: R-PUB-1, mode: code, checker: "lint/personal-info.sh", targets: [all], severity: error}
      - {ruleId: R-DOC-6, mode: code, checker: "lint/metadatainfo.sh", targets: [docs], severity: error}
      - {ruleId: R-DOC-8, mode: code, checker: "lint/single-scheme.sh", targets: [scheme], severity: error}
      - {ruleId: R-ENG-7, mode: code, checker: "lint/max-file-lines.sh", targets: [all], severity: error}
      - {ruleId: R-ENG-8, mode: agent, agent: service-agent, severity: error}   # 临时/验证文件一律仓内 tmp/ + gitignore 永不提交（rule/rule_eng.md；agent 侧自查）
      - {ruleId: R-UX-3, mode: agent, agent: service-agent, severity: error}   # 示例：界面黑话/用户视角由 agent 语义验证
    taskScheduler:                  # 多任务并发调度（concepts/task-scheduler.md；无关任务并发、相关任务串行；可调）
      enabled: true
      maxConcurrent: 4              # 全局并发上限（可调）
      perService: 2                 # 同服务并发上限
      perRepo: 1                    # 同仓默认串行（worktree/合并安全；可调）
      strategy: independent-first
      conflictPolicy: serialize-overlap   # dependsOn 交叠 / touches 交叠 / exclusive 同值 → 串行/阻塞
      applyConflictGate: "ask(pause-first|abort-current)"   # 两个并发任务在 Apply 关口冲突拦截：第一个任务 Apply 后，第二个任务判断有无实质冲突；有冲突直接询问暂停第一个任务(pause-first)还是放弃当前任务(abort-current)
      leaseTtl: 30m
      maxAttempts: 2
      spawn: "host:/task/spawn"     # 宿主 agent spawn 桥（每任务一个 dsh session）
      observability: "Task.status + TaskStateChanged + console #/tasks"
    permission:                     # 权限双态（2026-11-27 用户裁决，concepts/permission.md 规则 6）
      defaultPosture: allow-all     # 默认直给：所有权限直接给（日常动作零审批摩擦）
      escalationGate: popup         # 唯一强制闸：显式越权请求默认弹窗授权（内建默认不依赖配置）
      escalationRequest: "{sandbox_permissions: string, justification: string}"   # 升级声明格式（danger-full-access 等）；justification 随审计账留存
    workflows:
      default: core-system-developer-loop
      builtin: [core-system-developer-loop, default-task]
      factoryEnabledDefault: false  # core-system-developer-loop 出厂默认不启动（core-system 自我迭代显式开启；sybran 等对外项目默认关闭，经 developer-system/deploy-system 逐层询问绑定后按需启用）；default-task 为通用任务相位状态机
      immutableNodes: true          # 内置 core-system-developer-loop 主干节点拓扑锁定（不可删除、不可增删/重排节点，但全节点参数/Adapter 在 Scheme 与文档层可配置）
      undeletable: true             # 内置核心工作流禁止删除
      aliases:                      # Scheme Adapter 历史词形兼容映射（旧名自动映射至 core-system-developer-loop 或 default-task，不再作为独立 workflow 存在）
        core-workflow: core-system-developer-loop
        bug-lifecycle: core-system-developer-loop
        bug-workflow: core-system-developer-loop
        dev-delivery: core-system-developer-loop
        apply-workflow: default-task
        simple-shot: default-task
        watch-only: default-task
      adapters:                     # Scheme 层标准节点与跨系统 Adapter 契约（配置下沉至 Scheme/文档层，不再改代码）
        logSource: "{events: []string, minLevel: info|warn|error|fatal, services: ?[]ref, keywordMatch: ?string, timer: ?{enabled: bool, interval: ?duration, cron: ?string}, collector: ?{connector: ref, op: string, query: ?string, autoDevelopOnMissing: ?bool (=true)}}"
        agentJudge: "{unit: session|agent (=session), llm: ?{provider: ref (=openai-default), model: string, tier: ?low|standard|high (=high)}, globalRuleRefs: ?[]ref, criteria: ?string, outputs: [worth_fixing, ignore]}"
        approvalGate: "{mode: human|agent|auto (=human), autoCriteria: ?string, maxRiskLevel: ?low|medium|high (=low), fallback: human}"
        docApplyEntry: "{multiEntry: bool (=true), entryEvents: [DocApplied], docTypes: ?[]string (=[Goal, Desc, Rule, WorkflowDesign, ImplDoc, VerifyDoc, BugDoc]), skipPriorPhases: true}"
        systemBinding: "{service: !ref, resolution: default|install|import (=default), templateRef: ?ref, connector: ?ref, op: ?string, conventions: ?{branchPrefix: string, worktreeDir: string, tmpDir: string, maxFileLines: int}}"
        verification: "{mode: both|code|agent|human (=both), connector: ?ref (=connectops-code-audit), op: ?string (=audit), conditions: []{id: string, kind: code|test|agent|probe|custom, title: string, command: ?string, required: bool}, onFail: retry-develop|block|ask (=retry-develop)}"
        reportArchive: "{bugDocPolicy: invalidate|delete|keep (=invalidate), cleanTempBugDoc: ?bool (=false), statusWriteback: bool (=true), targetPhaseOnConverge: string (=InSync), postActions: ?[]{id: string, kind: doc-lifecycle|status-writeback|notify|custom, targetDocType: ?string, action: ?invalidate|delete|keep, enabled: bool, title: string}}"
    llm:                            # Session / ConnectorOps / Workflow 默认 Provider 与按任务智商分级路由
      defaultProvider: openai-default
      tiers:
        low:      {description: "重复性任务 / 日志过滤清洗 / 格式转换 / 巡检采集（低智商轻量高性价比模型）", defaultModel: "flash-tier"}
        standard: {description: "常规代码开发 / 单测执行 / 文档同步（标准开发模型）",                     defaultModel: "standard-tier"}
        high:     {description: "架构设计 / 复杂 Bug 根因诊断 / Agent 评审裁决（高智商深度推理模型）",     defaultModel: "reasoning-tier"}
      taskMapping:
        log-event: low
        connectops-log-collector: low
        agent-judge: high
        approval-gate: standard
        doc-apply: standard
        developer-system: high
        verify: standard
        connectops-code-audit: low
        deploy-system: low
        report-archive: low
        default-task: standard
    autoLevels: {rootAgent: "ask（默认，可配置 auto/all）", serviceAgent: auto, all: "需显式授权+权限系统放行"}  
    escalation: root                
    permissionSystem:
      defaultAdminRole: global/admin
      binding: [user->role, user->group->role]      # 只绑 role
      scopes: [global, system]
      agentJudgement: [agent, role, parent-agent]   # 灵活；跨系统 B 侧裁判
      hardRules: [deny delete agent/builtinRoot, deny disable scheme, deny delete role/global/admin]
    providerResolution: {defaultOrg: friddle-self-recursive-agent, prefixed: "github.com/<org>/<name>"}
    userSystem: builtin             
    events:
      levels: [debug, info, warn, error, fatal]     
      debug: 只进内存队列不落盘
      fatal: 必接 Notification
      ingestDefaults: {dedupWindow: 5m, groupMax: 100}
    sessions: {record: [PlanDoc, SessionLog]}
    sessionLiveness:   # 会话活性（KI-003，event.md 规则 14；agent-session.md §7）
      heartbeat: "会话推进点（相位推进/工具调用完成/产物落盘任一）上报——ops DB session_heartbeat 行+进程内计数；POST /v1/sessions/heartbeat 注册+GET /v1/sessions 查询"
      watchdog: "--session-watch-interval <dur>（0=关断零事件缺省不改行为面）；--stall-threshold <dur>（缺省 10m，event.md 规则 14②声明缺省）"
      selfHeal: "固定顺序（每步留事件）：注入固定 prompt「继续」→SessionHealed；仍无心跳→诊断（权限类 ApprovalNeeded 向上提交不自行绕过/人工类按 bind 通道上报/notification.md 规则 6 未配置=零通知零外发/长任务 LongTaskRunning 有进展=不判停滞）"
      escalation: "同会话连续自愈无效达阈值（--heal-retry-limit，缺省 2）→ Escalate 停自动处置升级（不静默重试）；进入 escalated 或收到 SessionClosed 后标记终态并退出 watchdog 周期巡检（防历史失活会话持续每周期重复发 SessionStalled 风暴）"
    skills: {cachePolicy: {ttl: 30d, invalidateOnProviderVersionChange: true}, promote: "高频→Global 走人审"}
    storage:
      docs: "sqlite docs DB=默认权威（--docs-backend 缺省 sqlite；--docs-db 必配；doc 表 (kind,scope,name) 键+resourceVersion 乐观锁；单写者队列/WAL）+ 本地 storage；git 布局=导出/公开格式（周期导出+commit+push 远程，历史=快照非逐次账；root 不得选 git）。迁移：--docs 旧布局根空库一次性种子导入保留 rv，非空库不导入=幂等；兼容期非 root 可显式 --docs-backend git。逐次正文历史=doc_history 账表（GET /v1/doc-history + rev-content 可查）；Repository 接口同一套写语义"
      docsExport:
        configSource: "sqlite docs_export_config 表（初值从 scheme.docTypes[].exportDefault 派生落库，可通过 GET/PUT /v1/docs-export/config 与控制台「文档导出配置」独立修改——禁止在导出器代码中硬编码过滤某类型）"
        includeRuntimeDocs: false   # 默认不导出 category=runtime（exportDefault=false）的运行时文档（BugDoc/DriftReport/PlanDoc/SessionLog）
        excludeDocTypes: [BugDoc, DriftReport, PlanDoc, SessionLog]
        excludeKinds: []
      opsLog: SQLite WAL（六表；DB=操作流水可丢弃可重建；每日对账）
      secrets: "SQLite 0600 独立文件（部署侧凭据真实值权威运行时面——secret: 引用的解析源；独立于 ops DB（秘密非缓存不可重建）与 docs DB（脱敏红线——值只进不出，任何查询/导出面只出名称零值出）；缺省关断，--secrets-db 显式装配）"
      refResolution: {cacheTtl: 10m, 失败降级旧缓存+Event}

  # ============================================================
  # 六、字段约定（conventions；A51/A52 后 Concepts 降级至此）
  # ============================================================
  conventions:
    status:                          
      observedGeneration: int        # 收敛到 Spec 第几代
      phase: string                  # 对象级粗状态
      conditions: "[]{type, status: True|False|Unknown, reason(枚举注册), message, lastTransitionTime}"
      drift: "{summary, reportRef}"  # Instance 必有
      writers: {status: workflow-engine(fieldManager), spec: human/agent-by-role}   # P2/P6
    tags:                            # 检索元数据（统一 0-100 标度；R-CTX-3 / R-DOC-6；统一落顶层 metadata 与 .metadatainfo 侧车，不嵌套进 spec，对齐 P2；读侧兼容旧 spec.metadata.*）
      metadata.tags: "?[]string"          # 关键 tag（tag∈唯一 tagType；词表无全局上限，conventions.context.tagModel）
      metadata.tagRelevance: "?map<string,int(0-100)>"  # 文档×tag 相关度（统一 0-100 标度；context.md §1.2）
      metadata.importance: "?int(0-100)"  # 全局重要度分（统一 0-100 标度，含事件 importance；由层级基准+人类评论因子+跨任务多样性折扣合成）
      metadata.humanScore: "?int(0-100)"  # 界面审核时的人类评论/重要度锚定分（0-100）
      metadata.digest: "?string"          # 一句话标题+描述（检索列表展示用）
      metadata.level: "?L0|L1|L2|L3|L4"   # 文档分级（L0 宪法刚性保底≥95 / L1 概念 / L2 运行时设计 / L3 证据 / L4 笔记）
      metadata.module: "?string"          # 主模块（单值；跨模块关系走 tags）
      metadata.trace: "?{requires: ?[]DocType, implements: ?[]{doc, sections?, designRev?}, verifies: ?[]{doc, sections?, targetRev?}, implemented_by: ?[]{doc, instance, sections?, status: synced|stale}, verified_by: ?[]{doc, instance, sections?, status: synced|stale}}"   # ServiceDesc 设计文档 ↔ ServiceInstance 实现/验证文档的 1:N [metadata 关联] 双向追踪（R-DOC-9）
    context:                         # 上下文装配与三段式自演化（concepts/context.md；R-CTX 底座规则；索引/缓存为派生物可重建）
      scoreScale: "0-100（全系统统一标度：importance / tagRelevance / affinity / humanScore / 事件 importance / Relevance(A,B) 一律 0-100）"
      relevanceFormula: "Relevance(A,B) = clamp_0..100(0.45*TagCoverage_Tversky + 0.20*Affinity + 0.25*Keyword_BM25 + 0.10*ScopePrior)"
      importanceFormula: "Importance(B) = clamp_{Floor(level)..100}(base(level) + humanScore + diversityDiscountedEmpirical)，其中 w_div(T_i) = 1 - max_{j<i} Relevance(T_i,T_j)/100（防同质任务刷分），L0 保底 95"
      index: "SQLite docs DB + 声明面(Scheme/Provider/ServiceDesc) + 事件 + 近期相关 Session 的结构化投影（doc/chunk/TagCtxShard；构建与失效归 connectops-context）"
      tagModel: "tag∈唯一 tagType；四族+Event+Session 同池打标；词表无全局上限——数量限制只在会话装配面（pack：每 tagType≤5、总计≤20，可配）"
      metadatainfo: "<doc>.md.metadatainfo 侧车：tags[]{tag,tag_type,relevance?}+importance 0-100+human_score? 0-100+trace?{requires,implements,verifies,implemented_by,verified_by}；系统内部元数据在定时导出 Git 时的快照载体；R-DOC-6/7/9"
      sessionStages: "三段式 Session（2026-11-27 落地定稿，权威=concepts/session.md）：①背景装配（LLM 描述命令→tag 分析先查 CtxCache→三路注入[工具使用/service 描述及 tag/global index 及 tag]→builtin RAG 查询[核心约束:尽量使用系统查找上下文]→类似 session 导入描述→developer_system 定位代码仓库→层层整理→产出背景）→ ②预更新执行（反复 ask 询问；会话没有命令——能做的永远是文档预更新 draft，命令都到 workflow 的 agent 节点执行的 agent；用户 apply 后进③）→ ③属性回整（apply 触发：LLM 判断哪些文档 ref/tag/重要程度/metainfo 属性要改，默认自动更新；内容类 Proposal 仍查重+人审）"
      sessionBackground: {maxChars: 5000, blockAttribution: true}   # 背景预算（默认最多 5k 字可配）+逐块溯源（每块标识资源/文件，点击可对应上下文）
      sessionMeta: {autoUpdate: true, scope: [ref, tag, importance, metainfo]}   # 第三段属性回整默认自动（越界即回滚记账；内容类永不自动）
      factors: {tagCoverage: 0.45, affinity: 0.20, keyword: 0.25, scopePrior: 0.10}
      rankWeights: {relevance: 0.70, importance: 0.20, recency: 0.10}
      recency: {halfLifeDays: 30}
      budget: {cachePoolMaxTokens: 500000, shardMaxTokens: 6000, defaultTakeRatio: 0.3, defaultTakeMaxTokens: 60000}   # CtxCache 容量与每次拿到的 takeBudget 均可动态调整
      packLimits: {maxTagsPerType: 5, maxTagsTotal: 20}
      reuse: {mode: "tag-shard-first + asymmetric-coverage", comboCoverageThreshold: 90, algorithm: tversky-tag-coverage}   # 按单 Tag 细粒度触发 TagCtxShard + 非对称覆盖率≥90 复用
      cache: {ttl: 7d, rebuildThreshold: 75, prewarm: true, updateFlow: "DocApplied→算 Relevance(UpdatedDoc,B)→仅≥rebuildThreshold(75) 标 stale 并触发重建（抑制写放大）"}
      ui: {sessionCtxView: true, cacheExpiryEditable: true, adjustableCacheSize: true, humanReviewFactor: true}
      affinity: {interval: 6h, scale: "0-100", factors: [cooccur, decay, pin]}
    cascade:                         
      rule: 目录即对象——删目录=级联删除其下一切
      crossDir: 跨目录引用走 Ref或跨系统提案
      externalCleanup: WorkService.tools 成对 cleanup op（Lint 强制；无系统级 Finalizer）
    metadata:
      reserved: [metadata, spec, status]
      labels: 自由注释性元数据，无选择语义
      frontmatter: name/docType/scope/labels/roles
